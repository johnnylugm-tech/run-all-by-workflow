# TEST_INVENTORY.yaml — P1→P2 test-case naming authority for taskq
# Maps every FR/NFR acceptance criterion enumerated in TRACEABILITY_MATRIX.md
# §5 test-to-requirement reverse index (forward trace in §2/§3) to an
# authoritative test function name. Each enumerated tc_id appears as its own
# entry; sub-case ranges (e.g. TC-FR01-01..07) are EXPANDED — they are NEVER
# collapsed. Cross-cutting coverage is signalled via cross_ref_frs /
# cross_ref_nfrs metadata; entries are never deleted for "logical coverage"
# reasons. derive_test_cases.md (P2) consumes this file to populate
# TEST_SPEC.md; implement_test_cases.md (P2) consumes the test_name field.
test_inventory:
  format_version: "1.1"
  srs_version: "1.0"
  matrix_section: "§5 test-to-requirement reverse index"
  source:
    srs: 01-requirements/SRS.md
    matrix: 01-requirements/TRACEABILITY_MATRIX.md
  naming_convention: "test_<fr_key_lower><nn>_<descriptor_snake>"
  naming_pattern_examples:
    - "test_fr01_01_empty_whitespace_rejection"
    - "test_nfr07_04_explicit_error_exit_behavior"
  layer_taxonomy:
    - unit: "pure logic / model / static inspection; no subprocess, no real store"
    - integration: "one or more real modules + real JSON store + real subprocess"
    - system: "end-to-end via `python -m taskq` or multi-process/concurrent run"
    - benchmark: "pytest-benchmark measurement for NFR latency/memory gates"
  tests:
    - tc_id: TC-FR01-01
      test_name: test_fr01_01_empty_whitespace_rejection
      fr_id: FR-01
      layer: unit
      spec_reference: "SRS.md §3 FR-01 (empty/whitespace rejection)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-01"
      description: "submit with an empty string or whitespace-only command is rejected"
      asserts:
        - "exit code equals 2"
        - "stderr contains empty/whitespace rejection message"
        - "$TASKQ_HOME/tasks.json is not written"
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR01-02
      test_name: test_fr01_02_length_rejection
      fr_id: FR-01
      layer: unit
      spec_reference: "SRS.md §3 FR-01 (length > 1000 chars)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-02"
      description: "submit with command length strictly greater than 1000 characters is rejected"
      asserts:
        - "exit code equals 2"
        - "stderr reports length violation"
        - "no entry written to tasks.json"
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR01-03
      test_name: test_fr01_03_injection_blacklist
      fr_id: FR-01
      layer: unit
      spec_reference: "SRS.md §3 FR-01 (blacklist ; | & $ > < `)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-03"
      description: "submit with any of ; | & $ > < ` is rejected regardless of surrounding context"
      asserts:
        - "each listed character causes exit code 2"
        - "stderr names the forbidden character"
        - "no entry written to tasks.json"
      cross_ref_frs: []
      cross_ref_nfrs:
        - NFR-02
    - tc_id: TC-FR01-04
      test_name: test_fr01_04_duplicate_name_rejection
      fr_id: FR-01
      layer: integration
      spec_reference: "SRS.md §3 FR-01 (duplicate pending/running --name)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-04"
      description: "submitting with --name that matches an existing pending or running task is rejected"
      asserts:
        - "exit code equals 2"
        - "stderr reports duplicate-name conflict"
        - "existing tasks.json contents are unchanged"
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR01-05
      test_name: test_fr01_05_valid_id_pending_record
      fr_id: FR-01
      layer: unit
      spec_reference: "SRS.md §3 FR-01 (8-hex id, pending status, fields)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-05"
      description: "a valid submit produces an 8-hex id, status pending, and recorded command/name/created_at"
      asserts:
        - "returned id matches ^[0-9a-f]{8}$"
        - "status is 'pending'"
        - "command, name, created_at fields are recorded"
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR01-06
      test_name: test_fr01_06_atomic_persistence
      fr_id: FR-01
      layer: integration
      spec_reference: "SRS.md §3 FR-01 (atomic tasks.json write)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-06"
      description: "successful submit writes tasks.json atomically via temp-file + os.replace"
      asserts:
        - "tasks.json is valid JSON after write"
        - "no tasks.json.<tmp> orphan remains"
        - "recorded entry matches submit input"
      cross_ref_frs: []
      cross_ref_nfrs:
        - NFR-03
        - NFR-08
    - tc_id: TC-FR01-07
      test_name: test_fr01_07_json_output
      fr_id: FR-01
      layer: integration
      spec_reference: "SRS.md §3 FR-01 (--json one-line output)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-01 → TC-FR01-07"
      description: "submit --json emits a single-line JSON object with id and status:'pending'"
      asserts:
        - "stdout is exactly one line"
        - "line is valid JSON"
        - "parsed object contains id and status=='pending'"
      cross_ref_frs:
        - FR-05
      cross_ref_nfrs: []
    - tc_id: TC-FR02-01
