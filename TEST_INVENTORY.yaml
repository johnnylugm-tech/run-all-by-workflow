      spec_reference: "SRS.md §3 FR-03 (HALF_OPEN success → CLOSED + reset count)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-03 → TC-FR03-05"
      description: "a successful HALF_OPEN probe transitions state to CLOSED and resets the failure count"
      asserts:
        - "state becomes 'CLOSED'"
        - "consecutive-failure count is reset to 0"
        - "no further rejection occurs until a new threshold streak"
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR03-06
      test_name: test_fr03_06_half_open_failure_reopens
      fr_id: FR-03
      layer: unit
      spec_reference: "SRS.md §3 FR-03 (HALF_OPEN failure → OPEN)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-03 → TC-FR03-06"
      description: "a failing HALF_OPEN probe returns breaker to OPEN and restarts the cooldown window"
      asserts:
        - "state becomes 'OPEN'"
        - "cooldown window is restarted from the failure timestamp"
        - "next run is rejected with exit 3"
