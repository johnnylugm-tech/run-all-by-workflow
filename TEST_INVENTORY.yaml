      trace_link: "TRACEABILITY_MATRIX.md §2 FR-04 → TC-FR04-01"
      description: "cache key is exactly sha256(command.encode('utf-8')).hexdigest()"
      asserts:
        - "signature for 'echo hi' equals sha256 hex of the literal command"
        - "different whitespace or quoting produce different signatures"
        - "unicode and control characters are encoded utf-8"
