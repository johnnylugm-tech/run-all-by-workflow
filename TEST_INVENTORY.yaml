      trace_link: "TRACEABILITY_MATRIX.md §2 FR-03 → TC-FR03-02"
      description: "before retry n, the executor sleeps TASKQ_BACKOFF_BASE × 2^n seconds via the injected sleep hook"
      asserts:
        - "sleep called with delay = base * 2**n for each n in 0..retry_cap-1"
        - "real sleep is bypassed via injection (no wall-clock dependency)"
        - "delay values are recorded and asserted"
      cross_ref_frs: []
      cross_ref_nfrs: []
    - tc_id: TC-FR03-03
