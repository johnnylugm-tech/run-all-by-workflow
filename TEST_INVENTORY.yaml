        - FR-05
      cross_ref_nfrs: []
    - tc_id: TC-FR03-07
      test_name: test_fr03_07_cross_process_persistent_breaker
      fr_id: FR-03
      layer: system
      spec_reference: "SRS.md §3 FR-03 (global shared breaker across processes)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-03 → TC-FR03-07"
      description: "process A opening the breaker is observable to process B via shared breaker.json with no loss"
      asserts:
        - "process B reads state 'OPEN' from breaker.json"
        - "process B rejects subsequent runs without subprocess"
        - "atomic write integrity preserved across processes"
      cross_ref_frs: []
      cross_ref_nfrs:
        - NFR-08
        - NFR-10
