      trace_link: "TRACEABILITY_MATRIX.md §2 FR-03 → TC-FR03-01"
      description: "failed/timeout result is retried up to the configured retry limit and no further"
      asserts:
        - "retry count equals TASKQ_RETRY_LIMIT on continued failure"
        - "no additional attempt occurs past the cap"
        - "final status reflects the last attempt outcome"
      cross_ref_frs: []
      cross_ref_nfrs: []
