      layer: integration
      spec_reference: "SRS.md §3 FR-03 (OPEN rejects with exit 3, no subprocess)"
      trace_link: "TRACEABILITY_MATRIX.md §2 FR-03 → TC-FR03-04"
      description: "while breaker is OPEN, run attempts are rejected with stderr and exit 3, without invoking a subprocess"
      asserts:
