      trace_link: "TRACEABILITY_MATRIX.md §2 FR-02 → TC-FR02-07"
      description: "concurrent writers under one ThreadPoolExecutor complete without corrupted tasks.json"
      asserts:
        - "final tasks.json is valid JSON"
        - "all writer attempts either committed or raised under lock"
        - "no entry is duplicated or silently dropped"
      cross_ref_frs: []
      cross_ref_nfrs:
        - NFR-03
        - NFR-08
    - tc_id: TC-FR03-01
